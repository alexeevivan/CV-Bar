name: Deploy to hoster.by

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hoster-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alexeevivan.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Read last deployed commit
        env:
          FTP_HOST: 87.232.64.171
          FTP_USER: github-deploy
          FTP_PASSWORD: ${{ secrets.HOSTER_FTP_PASSWORD }}
        run: |
          test -n "$FTP_PASSWORD"
          rm -f "$RUNNER_TEMP/deploy-sha"
          lftp <<EOF || true
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-allow no
          open --user "$FTP_USER" --password "$FTP_PASSWORD" "ftp://$FTP_HOST"
          get -o "$RUNNER_TEMP/deploy-sha" /.deploy-sha
          bye
          EOF

          DEPLOY_BASE=""
          if test -s "$RUNNER_TEMP/deploy-sha"; then
            CANDIDATE="$(tr -d '[:space:]' < "$RUNNER_TEMP/deploy-sha")"
            if git cat-file -e "$CANDIDATE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$CANDIDATE" "$GITHUB_SHA"; then
              DEPLOY_BASE="$CANDIDATE"
            fi
          fi

          if test -n "$DEPLOY_BASE"; then
            if ! git diff --quiet "$DEPLOY_BASE" "$GITHUB_SHA" -- \
              .github/workflows/deploy-hoster.yml \
              scripts/create-ftp-deploy-plan.mjs; then
              echo "Deployment logic changed; scheduling a full deployment."
              DEPLOY_BASE=""
            fi
          else
            echo "No verified server deployment marker; scheduling a full deployment."
          fi

          echo "DEPLOY_BASE=$DEPLOY_BASE" >> "$GITHUB_ENV"

      - name: Create incremental deployment plan
        run: |
          node scripts/create-ftp-deploy-plan.mjs "$DEPLOY_BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-plan.lftp"
          cat "$RUNNER_TEMP/deploy-plan.lftp"

      - name: Upload changed dist files to hoster.by
        env:
          FTP_HOST: 87.232.64.171
          FTP_USER: github-deploy
          FTP_PASSWORD: ${{ secrets.HOSTER_FTP_PASSWORD }}
        run: |
          test -n "$FTP_PASSWORD"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/current-deploy-sha"
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-allow no
          open --user "$FTP_USER" --password "$FTP_PASSWORD" "ftp://$FTP_HOST"
          source "$RUNNER_TEMP/deploy-plan.lftp"
          put -O / "$RUNNER_TEMP/current-deploy-sha"
          mv /current-deploy-sha /.deploy-sha
          cls -l /index.html
          cls -l /design/index.html
          cls -l /bar-setup/index.html
          cls -l /training/index.html
          bye
          EOF
