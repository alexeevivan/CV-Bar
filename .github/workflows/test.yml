name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore WebP conversion cache
        uses: actions/cache@v4
        with:
          path: .cache/webp-v1
          key: webp-v1-${{ runner.os }}-${{ hashFiles('src/assets/content/**/*.jpg', 'src/assets/content/**/*.jpeg', 'src/assets/content/**/*.png') }}
          restore-keys: |
            webp-v1-${{ runner.os }}-
      - run: npm test
      - run: npm run build
